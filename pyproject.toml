[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "etm-flow"
version = "0.1.0"
description = "ETM/TRBE control-flow extraction and anomaly-detection pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "tqdm>=4.65",
]

[project.optional-dependencies]
trace = [
  "capstone>=5.0",
  "pyelftools>=0.30",
]
ml = [
  "tensorflow>=2.16,<3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
etm-symbolize = "etm_flow.trace.symbolize:main"
etm-preprocess = "etm_flow.data.preprocess:main"
etm-build-dataset = "etm_flow.data.dataset:main"
etm-train = "etm_flow.modeling.train:main"
etm-compress = "etm_flow.modeling.compress:main"
etm-export-tflite = "etm_flow.modeling.export_tflite:main"
etm-predict = "etm_flow.modeling.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100
